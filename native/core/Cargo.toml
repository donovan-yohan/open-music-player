[package]
name = "soundq-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
sha2 = "0.10.9"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
