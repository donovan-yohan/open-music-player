name: Native Clients
on:
  pull_request:
    paths: ['native/**', 'scripts/native-client', '.github/workflows/native-clients.yml']
  push:
    branches: [main]
    paths: ['native/**', 'scripts/native-client', '.github/workflows/native-clients.yml']
permissions:
  contents: read
jobs:
  core:
    name: Native Rust core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: scripts/test native
      - name: Test listening queue through the host core ABI
        run: |
          python3 -B <<'PY'
          import json
          import os
          from pathlib import Path
          import shutil
          import subprocess
          import sys
          import tempfile

          cargo = shutil.which('cargo')
          if cargo is None:
              raise SystemExit('Cargo is required')
          manifest = str(Path('native/core/Cargo.toml').resolve())
          subprocess.run([cargo, 'build', '--locked', '--jobs', '2', '--manifest-path', manifest], check=True)
          metadata = subprocess.check_output([cargo, 'metadata', '--format-version', '1', '--no-deps', '--locked', '--manifest-path', manifest])
          suffix = 'dylib' if sys.platform == 'darwin' else 'so'
          library = Path(json.loads(metadata)['target_directory']) / 'debug' / ('libsoundq_core.' + suffix)
          evidence = Path(tempfile.mkdtemp(prefix='listening-queue-', dir=os.environ['RUNNER_TEMP']))
          (evidence / 'tmp').mkdir()
          env = dict(os.environ, SOUNDQ_CORE_LIBRARY=str(library), SOUNDQ_REPAIR_EVIDENCE=str(evidence))
          subprocess.run([sys.executable, '-B', 'native/tests/listening_queue.py'], env=env, check=True)
          PY
      - name: Test persistence feedback and restored cursors (Rust23)
        run: |
          python3 -B <<'PY'
          import os
          from pathlib import Path
          import shutil
          import subprocess
          import sys
          import tempfile

          cargo = shutil.which('cargo')
          if cargo is None:
              raise SystemExit('Cargo is required')
          output = Path(tempfile.mkdtemp(prefix='queue-feedback-', dir=os.environ['RUNNER_TEMP']))
          # Instrumented private sources must never share the production cdylib target.
          env = dict(os.environ, SOUNDQ_RUST_BIN=str(Path(cargo).parent), CARGO_TARGET_DIR=str(output / 'target'))
          subprocess.run([sys.executable, '-B', 'native/tests/queue_feedback_regressions.py', '--source-root', str(Path.cwd()), '--rust', '--output', str(output / 'rust')], env=env, check=True)
          PY
      - name: Test cursor extraction anchors (Anchor14)
        run: python3 -B -m unittest discover -s native/tests -p test_queue_restore_cursor_regressions.py -v
      - name: Test offline performance evidence
        run: python3 -B -m unittest discover -s native/tests -p test_matched_performance.py -v
      - name: Test readback failure evidence retention
        run: python3 -B -m unittest discover -s native/tests -p test_readback_failure_retention.py -v
      - name: Enforce phase baseline admission and budget mutation controls
        run: python3 -B -m unittest discover -s native/tests -p test_performance_gate.py -v
      - name: Test explicit-artifact Flutter launch and report refusal controls
        run: python3 -B -m unittest discover -s native/tests -p test_flutter_profile_launch.py -v
      - name: Enforce Flutter renderer cohort and budget mutation controls
        run: python3 -B -m unittest discover -s native/tests -p test_flutter_renderer_gate.py -v
      - name: Enforce captured-response clock and latency budget controls
        run: python3 -B -m unittest discover -s native/tests -p test_window_response_gate.py -v
  macos:
    name: Native macOS build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Test public window-response collector without device collection
        run: python3 -B -m unittest discover -s native/tests -p test_window_response.py -v
      - run: scripts/build native-macos
        id: native-macos-build
      - name: Test Flutter owned-player sampler without audio
        id: flutter-native-readback
        run: python3 -B native/tests/flutter_native_readback_regressions.py --output "$RUNNER_TEMP/flutter-native-readback"
      - name: Preserve Flutter owned-player sampler diagnostics
        if: always() && (steps.flutter-native-readback.outcome == 'success' || steps.flutter-native-readback.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: native-macos-flutter-native-readback
          path: |
            ${{ runner.temp }}/flutter-native-readback/*.log
            ${{ runner.temp }}/flutter-native-readback/receipt.json
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7
      - name: Collect native search optical discriminator
        id: search-optical-diagnostic
        run: |
          python3 -B <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import sys
          import tempfile

          output = Path(tempfile.mkdtemp(prefix='search-optical-', dir=os.environ['RUNNER_TEMP']))
          # The runner requires a fresh destination; retain the allocated parent.
          evidence = output / 'evidence'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('evidence=' + str(output) + '\n')
          subprocess.run([sys.executable, '-B', 'native/tests/search_optical_diagnostics.py', '--output', str(evidence)], check=True)
          PY
      - name: Preserve native search discriminator
        if: always() && steps.search-optical-diagnostic.outputs.evidence != ''
        uses: actions/upload-artifact@v4
        with:
          name: native-macos-search-optical-diagnostic
          path: ${{ steps.search-optical-diagnostic.outputs.evidence }}
          if-no-files-found: error
      - name: Test macOS queue disclosure and unattached AppKit layout
        id: macos-layout
        # Collector failure must not hide product regressions or make the job green.
        if: ${{ !cancelled() && steps.native-macos-build.outcome == 'success' }}
        run: |
          python3 -B <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import sys
          import tempfile

          root = Path.cwd()
          sys.path.insert(0, str(root / 'native/tests'))
          import queue_current_marker_regressions

          output = Path(tempfile.mkdtemp(prefix='macos-queue-', dir=os.environ['RUNNER_TEMP']))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('evidence=' + str(output) + '\n')
          result = queue_current_marker_regressions.run_platform('macos', root, output / 'current-marker')
          if result:
              raise SystemExit(result)
          subprocess.run([sys.executable, '-B', 'native/tests/queue_transport_layout.py', '--appkit', '--output', str(output / 'transport-layout')], check=True)
          # The layout entrypoint compiles the actual Library/dock production
          # builder, tokens, assets and scalar publication counters. Keep package
          # provenance/refusal controls separately executable and fail closed.
          subprocess.run([sys.executable, '-B', 'native/tests/native_review_regressions.py', '--phase-only'], check=True)
          subprocess.run([sys.executable, '-B', 'native/tests/library_metadata_regressions.py', '--output', str(output / 'library-metadata')], check=True)
          subprocess.run([sys.executable, '-B', 'native/tests/library_favorites_regressions.py', '--output', str(output / 'library-favorites')], check=True)
          PY
      - name: Preserve macOS layout diagnostics
        if: always() && steps.macos-layout.outputs.evidence != ''
        uses: actions/upload-artifact@v4
        with:
          name: native-macos-layout-diagnostics
          path: ${{ steps.macos-layout.outputs.evidence }}
          if-no-files-found: error
      - name: Test terminal EOF feedback through the fresh core ABI (Mac9)
        run: |
          python3 -B <<'PY'
          import json
          import os
          from pathlib import Path
          import shutil
          import subprocess
          import sys
          import tempfile

          cargo = shutil.which('cargo')
          if cargo is None:
              raise SystemExit('Cargo is required')
          manifest = str(Path('native/core/Cargo.toml').resolve())
          # Rebuild production explicitly; cargo test only refreshes test executables.
          subprocess.run([cargo, 'build', '--release', '--locked', '--jobs', '2', '--manifest-path', manifest], check=True)
          metadata = subprocess.check_output([cargo, 'metadata', '--format-version', '1', '--no-deps', '--locked', '--manifest-path', manifest])
          library = Path(json.loads(metadata)['target_directory']) / 'release/libsoundq_core.dylib'
          output = Path(tempfile.mkdtemp(prefix='queue-feedback-', dir=os.environ['RUNNER_TEMP']))
          env = dict(os.environ, SOUNDQ_CORE_LIBRARY=str(library))
          subprocess.run([sys.executable, '-B', 'native/tests/queue_feedback_regressions.py', '--source-root', str(Path.cwd()), '--macos', '--output', str(output / 'macos')], env=env, check=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: soundq-native-macos-preview
          path: native/artifacts/SoundQ Native Preview.app
          if-no-files-found: error
  android:
    name: Native Android build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'ndk;28.2.13676358' 'cmake;3.22.1' 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - run: scripts/build native-android
      - name: Test exact settled restore cursor (Cursor6)
        run: |
          python3 -B <<'PY'
          import os
          from pathlib import Path
          import shutil
          import subprocess
          import sys
          import tempfile

          output = Path(tempfile.mkdtemp(prefix='queue-cursor-', dir=os.environ['RUNNER_TEMP']))
          gradle = shutil.which('gradle')
          if gradle is None:
              raise SystemExit('The existing Gradle installation is required')
          lib = Path(gradle).resolve().parents[1] / 'lib'
          # Reuse Gradle's installed Kotlin compiler and runtime, without resolving dependencies.
          home = output / 'kotlin-home'
          (home / 'lib').mkdir(parents=True)
          for artifact in ('kotlin-compiler-embeddable', 'kotlin-stdlib', 'kotlin-script-runtime', 'kotlin-reflect'):
              jars = list(lib.glob(artifact + '-[0-9]*.jar'))
              if len(jars) != 1:
                  raise SystemExit('Expected one installed Gradle Kotlin dependency: ' + artifact)
              name = 'kotlin-compiler' if artifact == 'kotlin-compiler-embeddable' else artifact
              shutil.copyfile(jars[0], home / 'lib' / (name + '.jar'))
          java = Path(os.environ['JAVA_HOME']) / 'bin/java'
          launcher = output / 'kotlinc'
          launcher.write_text('#!' + sys.executable + '\nimport os, sys\nos.execv(' + repr(str(java)) + ', ' + repr([str(java), '-Dkotlin.home=' + str(home), '-cp', str(home / 'lib/kotlin-compiler.jar') + os.pathsep + str(lib / '*'), 'org.jetbrains.kotlin.cli.jvm.K2JVMCompiler', '-kotlin-home', str(home), '-classpath', str(home / 'lib/kotlin-stdlib.jar'), '-Xbackend-threads=2']) + ' + sys.argv[1:])\n')
          launcher.chmod(0o755)
          env = dict(os.environ, SOUNDQ_KOTLINC=str(launcher))
          subprocess.run([sys.executable, '-B', 'native/tests/queue_restore_cursor_regressions.py', '--source-root', str(Path.cwd()), '--output', str(output / 'cursor')], env=env, check=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: soundq-native-android-preview
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
