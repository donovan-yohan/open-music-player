name: Native Clients
on:
  pull_request:
    paths: ['native/**', 'scripts/native-client', '.github/workflows/native-clients.yml']
  push:
    branches: [main]
    paths: ['native/**', 'scripts/native-client', '.github/workflows/native-clients.yml']
permissions:
  contents: read
jobs:
  core:
    name: Native Rust core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: scripts/test native
      - name: Test listening queue through the host core ABI
        run: |
          python3 -B <<'PY'
          import json
          import os
          from pathlib import Path
          import shutil
          import subprocess
          import sys
          import tempfile

          cargo = shutil.which('cargo')
          if cargo is None:
              raise SystemExit('Cargo is required')
          manifest = str(Path('native/core/Cargo.toml').resolve())
          subprocess.run([cargo, 'build', '--locked', '--jobs', '2', '--manifest-path', manifest], check=True)
          metadata = subprocess.check_output([cargo, 'metadata', '--format-version', '1', '--no-deps', '--locked', '--manifest-path', manifest])
          suffix = 'dylib' if sys.platform == 'darwin' else 'so'
          library = Path(json.loads(metadata)['target_directory']) / 'debug' / ('libsoundq_core.' + suffix)
          evidence = Path(tempfile.mkdtemp(prefix='listening-queue-', dir=os.environ['RUNNER_TEMP']))
          (evidence / 'tmp').mkdir()
          env = dict(os.environ, SOUNDQ_CORE_LIBRARY=str(library), SOUNDQ_REPAIR_EVIDENCE=str(evidence))
          subprocess.run([sys.executable, '-B', 'native/tests/listening_queue.py'], env=env, check=True)
          PY
      - name: Test offline performance evidence
        run: python3 -B -m unittest discover -s native/tests -p test_matched_performance.py -v
  macos:
    name: Native macOS build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - run: scripts/build native-macos
      - name: Test macOS queue disclosure and unattached AppKit layout
        run: |
          python3 -B <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import sys
          import tempfile

          root = Path.cwd()
          sys.path.insert(0, str(root / 'native/tests'))
          import queue_current_marker_regressions

          output = Path(tempfile.mkdtemp(prefix='macos-queue-', dir=os.environ['RUNNER_TEMP']))
          result = queue_current_marker_regressions.run_platform('macos', root, output / 'current-marker')
          if result:
              raise SystemExit(result)
          subprocess.run([sys.executable, '-B', 'native/tests/queue_transport_layout.py', '--appkit', '--output', str(output / 'transport-layout')], check=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: soundq-native-macos-preview
          path: native/artifacts/SoundQ Native Preview.app
          if-no-files-found: error
  android:
    name: Native Android build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'ndk;28.2.13676358' 'cmake;3.22.1' 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - run: scripts/build native-android
      - uses: actions/upload-artifact@v4
        with:
          name: soundq-native-android-preview
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
