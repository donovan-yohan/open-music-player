name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-scope:
    name: PR CI Scope
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      - name: Checkout tested merge
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Classify tested merge against its first parent
        id: scope
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # The tested base owns routing policy. Changes to the selector itself
          # get the full suite; the candidate selector is tested by Delivery Harness.
          selector="$RUNNER_TEMP/ci_pr_scope.py"
          if [[ -z "$GITHUB_SHA" || -z "$PR_HEAD_SHA" ]] ||
             [[ "$(git --no-replace-objects rev-parse --verify HEAD)" != "$GITHUB_SHA" ]] ||
             [[ "$(git --no-replace-objects rev-parse --verify HEAD^2)" != "$PR_HEAD_SHA" ]] ||
             ! git --no-replace-objects show HEAD^1:scripts/ci_pr_scope.py > "$selector"; then
            printf 'scope=full\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 -I -B "$selector"

  delivery-harness:
    name: Delivery Harness
    needs: pr-scope
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest

    steps:
      - name: Prepare temporary root
        run: |
          printf 'TMPDIR=%s\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run agentic delivery harness
        run: scripts/lint delivery

      - name: Test Flutter CI partition and evidence
        run: python3 -B scripts/test_ci_flutter.py

      - name: Test observability operator diagnostics
        run: python3 -m unittest discover -s deploy/observability -p 'test_*.py' -v

      - name: Plan exact-head dev cycle
        run: scripts/agentic-cycle --committed-only --base origin/main

      - name: Test production release qualification
        run: python3 scripts/test_release_receipt.py

      - name: Test release audit classifier
        run: scripts/release-audit --self-test

      - name: Test CI pull request scope
        run: python3 -I -B scripts/test_ci_pr_scope.py

      - name: Verify PR routing completed
        if: github.event_name == 'pull_request' && needs.pr-scope.result != 'success'
        run: |
          printf '%s\n' 'PR scope job did not succeed; refusing a green Delivery Harness.' >&2
          exit 1

  # Job-level routing keeps the original required check names registered. Only
  # an explicit successful PR decision suppresses product jobs. Pushes always
  # run the complete suite for production release qualification.
  backend-tests:
    name: Backend tests (${{ matrix.shard }})
    needs: pr-scope
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.pr-scope.result != 'success' || needs.pr-scope.outputs.scope != 'delivery-only') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [api, api-playlists, api-weekly, api-weekly-ceiling, database, provider, application, remaining]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Run guarded race and coverage shard
        run: python3 -B scripts/ci_backend.py run "$SHARD" "$RUNNER_TEMP/backend-go-$SHARD"
        env:
          SHARD: ${{ matrix.shard }}

      - name: Retain shard results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-go-${{ matrix.shard }}
          path: ${{ runner.temp }}/backend-go-${{ matrix.shard }}
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  backend-lint:
    name: Backend lint
    needs: pr-scope
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.pr-scope.result != 'success' || needs.pr-scope.outputs.scope != 'delivery-only') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Install dependencies
        run: go mod download

      - name: Test backend CI contracts
        run: python3 -B ../scripts/test_ci_backend.py -v

      - name: Run repository backend lint
        run: ../scripts/lint backend

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.63.4
          install-mode: goinstall
          skip-cache: true
          working-directory: backend

  backend-build:
    name: Backend build and replay
    needs: pr-scope
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.pr-scope.result != 'success' || needs.pr-scope.outputs.scope != 'delivery-only') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Install dependencies
        run: go mod download

      - name: Run AI assist replay eval
        run: ../scripts/eval ai-assist --mode replay --output "$RUNNER_TEMP/ai-assist-replay.jsonl"

      - name: Build
        run: ../scripts/build backend

  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    needs: [pr-scope, backend-tests, backend-lint, backend-build]
    if: ${{ always() && (github.event_name != 'pull_request' || needs.pr-scope.result != 'success' || needs.pr-scope.outputs.scope != 'delivery-only') }}
    steps:
      - name: Require every backend lane to succeed
        env:
          TESTS: ${{ needs.backend-tests.result }}
          LINT: ${{ needs.backend-lint.result }}
          BUILD: ${{ needs.backend-build.result }}
        run: |
          python3 -c 'import sys; sys.exit(0 if sys.argv[1:] == ["success"] * 3 else f"Backend lane results (tests, lint, build): {sys.argv[1:]}")' "$TESTS" "$LINT" "$BUILD"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download Go shard receipts
        uses: actions/download-artifact@v4
        with:
          pattern: backend-go-*
          path: ${{ runner.temp }}/backend-go-shards

      - name: Verify all Go test receipts and merge atomic coverage
        run: python3 -B scripts/ci_backend.py merge "$RUNNER_TEMP/backend-go-shards" backend/coverage.out "$(git rev-parse HEAD)"

      - name: Retain merged Go coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.out
          if-no-files-found: error
          overwrite: true
          retention-days: 7

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: backend/coverage.out
          flags: backend
        continue-on-error: true
      - name: Refuse a cancelled backend workflow
        if: ${{ cancelled() }}
        run: |
          printf '%s\n' 'Backend workflow was cancelled; refusing a green required check.' >&2
          exit 1

  analyzer:
    name: Audio Analyzer (MIR)
    needs: pr-scope
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.pr-scope.result != 'success' || needs.pr-scope.outputs.scope != 'delivery-only') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lint analyzer wiring
        run: scripts/lint analyzer

      - name: Run analyzer unit image
        run: scripts/test analyzer

      - name: Build pinned analyzer image
        run: scripts/build analyzer

  stems:
    name: Stem Separation (DSP contract)
    needs: pr-scope
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.pr-scope.result != 'success' || needs.pr-scope.outputs.scope != 'delivery-only') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Fast contract stage only: crossover null-sum, opus encoder uniformity,
      # manifest shape, and the checkpoint-source allowlist. The full
      # stems-runtime image (torch-cpu + demucs + baked weights) is not built in
      # CI; it is an explicit `docker build --target stems-runtime backend`.
      - name: Lint stems DSP helper
        run: scripts/lint stems

      - name: Run stems DSP contract image
        run: scripts/test stems

  client-vm:
    name: Flutter VM shard ${{ matrix.shard }}
    needs: pr-scope
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.pr-scope.result != 'success' || needs.pr-scope.outputs.scope != 'delivery-only') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'
          cache: true
      - name: Install client audio fixture dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Get dependencies
        working-directory: client
        run: flutter pub get --enforce-lockfile
      - name: Prepare fixtures and run Flutter VM shard
        env:
          SHARD: ${{ matrix.shard }}
        run: TMPDIR="$RUNNER_TEMP" scripts/test client-shard "$SHARD" "$RUNNER_TEMP/client-vm-shard-$SHARD"
      - name: Preserve verified Flutter VM shard evidence
        uses: actions/upload-artifact@v4
        with:
          name: client-vm-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/client-vm-shard-${{ matrix.shard }}/
          if-no-files-found: error
          retention-days: 7
          # Selective retries replace the rerun shard; untouched siblings are
          # still bound to the same workflow run and tested SHA at the join.
          overwrite: true

  client-contracts:
    name: Flutter analysis and fixture contracts
    needs: pr-scope
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.pr-scope.result != 'success' || needs.pr-scope.outputs.scope != 'delivery-only') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'
          cache: true

      - name: Analyze code
        run: ../scripts/lint client

      - name: Test production native-readback adapter contract
        id: native-readback-method
        run: python3 -B test/just_audio_native_readback_contracts.py --output "$RUNNER_TEMP/native-readback-method"

      - name: Preserve native-readback adapter diagnostics
        if: always() && (steps.native-readback-method.outcome == 'success' || steps.native-readback-method.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: client-native-readback-method
          path: |
            ${{ runner.temp }}/native-readback-method/*.log
            ${{ runner.temp }}/native-readback-method/receipt.json
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7

      - name: Test opted-in fixture refusal and credential-session isolation
        run: flutter test --no-pub --concurrency=1 --dart-define=SOUNDQ_PERFORMANCE_FIXTURE=true test/performance_fixture_test.dart test/performance_fixture_source_test.dart test/performance_fixture_export_test.dart

  client-web:
    name: Flutter web build
    needs: pr-scope
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.pr-scope.result != 'success' || needs.pr-scope.outputs.scope != 'delivery-only') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'
          cache: true
      - name: Build Flutter web
        run: scripts/build client-web

  # Keep the one protected Flutter context. A failed/skipped/cancelled child
  # cannot turn this into an implicitly skipped (and therefore green) job.
  client:
    name: Client (Flutter)
    needs: [pr-scope, client-vm, client-contracts, client-web]
    if: ${{ always() && (github.event_name != 'pull_request' || needs.pr-scope.result != 'success' || needs.pr-scope.outputs.scope != 'delivery-only') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Require all Flutter lanes
        env:
          VM_RESULT: ${{ needs.client-vm.result }}
          CONTRACTS_RESULT: ${{ needs.client-contracts.result }}
          WEB_RESULT: ${{ needs.client-web.result }}
        run: python3 -I -B scripts/ci_flutter.py require "$VM_RESULT" "$CONTRACTS_RESULT" "$WEB_RESULT"
      - name: Download Flutter VM shard evidence
        uses: actions/download-artifact@v4
        with:
          pattern: client-vm-shard-*
          path: ${{ runner.temp }}/client-vm-evidence
      - name: Verify all test evidence and merge LCOV
        run: python3 -I -B scripts/ci_flutter.py merge "$RUNNER_TEMP/client-vm-evidence" client/coverage/lcov.info
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: client/coverage/lcov.info
          flags: client
        continue-on-error: true
      - name: Refuse a cancelled Flutter workflow
        if: ${{ cancelled() }}
        run: |
          printf '%s\n' 'Flutter workflow was cancelled; refusing a green required check.' >&2
          exit 1

  extension:
    name: Extension (TypeScript)
    needs: pr-scope
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.pr-scope.result != 'success' || needs.pr-scope.outputs.scope != 'delivery-only') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: ../scripts/lint extension

      - name: Run extension tests
        run: ../scripts/test extension

      - name: Build
        run: ../scripts/build extension

      - name: Package extension
        run: |
          mkdir -p dist-zip
          cd dist
          zip -r ../dist-zip/extension.zip .

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: chrome-extension
          path: extension/dist-zip/extension.zip
          retention-days: 7

  agent-evals:
    name: Agent Search Evals
    needs: pr-scope
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.pr-scope.result != 'success' || needs.pr-scope.outputs.scope != 'delivery-only') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.16"
          enable-cache: true
          cache-dependency-glob: |
            agents/candidate_assembly/uv.lock
            evals/audio_mir/uv.lock

      - name: Sync candidate-assembly package
        working-directory: agents/candidate_assembly
        run: uv sync

      - name: Run Go-to-Python worker contract test
        working-directory: backend
        run: GOFLAGS=-buildvcs=false go test ./internal/research -run '^TestCommandRunnerGoToPythonWorkerContract$'

      - name: Run candidate-assembly unit tests
        working-directory: agents/candidate_assembly
        run: uv run pytest -q

      - name: Lint and test audio MIR eval harness
        run: |
          scripts/lint audio-mir
          scripts/test audio-mir

      - name: Run agent-search replay eval
        run: scripts/eval agent-search --mode replay --output "$RUNNER_TEMP/agent-search-replay.jsonl"

  local-smoke:
    name: Local Stack Smoke
    needs: pr-scope
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.pr-scope.result != 'success' || needs.pr-scope.outputs.scope != 'delivery-only') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      COMPOSE_PROJECT_NAME: soundq-smoke-${{ github.run_id }}-${{ github.run_attempt }}
      SERVER_PORT: 18080
      POSTGRES_PORT: 15434
      REDIS_PORT: 16380
      MINIO_PORT: 19000
      MINIO_CONSOLE_PORT: 19001
      OMP_BACKEND_BASE_URL: http://localhost:18080

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go for preview proxy smoke
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: false

      - name: Restore verified-source MinIO build layers
        id: minio-cache
        continue-on-error: true
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/soundq-minio-cache
          key: soundq-smoke-minio-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('backend/Dockerfile', 'docker-compose.local-low-memory.yml') }}

      - name: Set up isolated Buildx builder
        id: smoke-builder
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver: docker-container
          cache-binary: false
          use: false

      - name: Build low-memory stack images and check bundled preview proxy
        env:
          OMP_SMOKE_BUILDER: ${{ steps.smoke-builder.outputs.name }}
          OMP_SMOKE_CACHE_DIR: ${{ runner.temp }}/soundq-minio-cache
          # PRs (including forks) can read the default branch's public build
          # layers but do not write a cache. No registry or runtime token shim.
          OMP_SMOKE_CACHE_EXPORT: ${{ (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.minio-cache.outputs.cache-hit != 'true') && 'true' || 'false' }}
        run: |
          (
            docker pull nginx:1.28-alpine
            scripts/smoke preview-proxy
          ) &
          preview=$!
          # Keep the large analyzer image in the runner's native Docker builder
          # rather than exporting and reloading it from the cache builder.
          docker compose -f docker-compose.local-low-memory.yml build backend analyzer &
          app=$!
          status=0
          scripts/ci-smoke-storage-build || status=$?
          wait "$app" || status=$?
          wait "$preview" || status=$?
          exit "$status"

      - name: Start isolated low-memory stack
        run: scripts/dev isolated-prebuilt

      - name: Run isolated smoke
        run: scripts/smoke isolated

      - name: Run isolated playback smoke
        run: scripts/smoke playback-isolated

      - name: Cleanup low-memory stack
        if: always()
        run: scripts/local-low-memory.sh clean

      - name: Save verified-source MinIO build layers
        if: >-
          success() && github.event_name == 'push' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
          steps.minio-cache.outputs.cache-hit != 'true' &&
          steps.minio-cache.outputs.cache-primary-key != ''
        continue-on-error: true
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/soundq-minio-cache
          key: ${{ steps.minio-cache.outputs.cache-primary-key }}
