name: nightly-apk

# Rolling nightly APK: latest commit on main -> one overwritten artifact.
# No formal releases; previous uploads age out via the 7-day retention.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Version info
        id: ver
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        working-directory: client
        env:
          OMP_API_BASE_URL: ${{ vars.OMP_NIGHTLY_API_BASE_URL || 'http://10.0.2.2:8080/api/v1' }}
        run: flutter build apk --debug --dart-define=OMP_API_BASE_URL="$OMP_API_BASE_URL"

      - name: Rename APK
        run: |
          mkdir -p dist
          cp client/build/app/outputs/flutter-apk/app-debug.apk \
            "dist/soundq-nightly-${{ steps.ver.outputs.date }}-${{ steps.ver.outputs.sha }}.apk"

      - name: Remove previous nightly artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # best-effort: delete any existing nightly artifact so only the latest remains
          gh api --paginate "repos/${{ github.repository }}/actions/artifacts?name=soundq-nightly" \
            --jq '.artifacts[].id' 2>/dev/null | while read -r id; do
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" || true
          done

      - name: Upload nightly APK
        uses: actions/upload-artifact@v4
        with:
          name: soundq-nightly
          path: dist/*.apk
          retention-days: 7
          if-no-files-found: error

      - name: Job summary
        env:
          API_BASE: ${{ vars.OMP_NIGHTLY_API_BASE_URL || 'http://10.0.2.2:8080/api/v1' }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<SUMMARY
          ### Nightly APK ready
          - Commit: ${{ steps.ver.outputs.sha }} (${{ steps.ver.outputs.date }})
          - Download from this run's **Artifacts** section: soundq-nightly
          - API base baked in: $API_BASE
          SUMMARY
